description: >
  Installs mise and tools declared in the repository's mise.toml. Sets JAVA_HOME
  when java is configured. Pass tools as space-separated mise tool names from
  the consumer's mise.toml (e.g. "node yarn"). When tools is empty, installs
  all tools from mise.toml.
parameters:
  locked:
    type: boolean
    default: true
    description: >
      When true, runs `mise install --locked` so CI uses the committed mise.lock
      and does not rewrite it. Requires a mise.lock with URLs for the current
      platform. Set to false for repos that have not adopted lockfiles yet.
  tools:
    type: string
    default: ""
    description: >
      Space- or newline-separated mise tool names to install (e.g. "java" or
      "node yarn"). Names must match entries in the consumer's mise.toml. Omit
      or leave empty to install all tools declared in mise.toml.
  hooks:
    type: boolean
    default: false
    description: >
      When true, enables mise experimental mode so project-level [hooks]
      postinstall in mise.toml runs during install.
  project_root:
    type: string
    default: ""
    description: >
      Directory containing mise.toml. When set, cd there before installing.
      Use when the job working_directory is a subdirectory of the repo.
steps:
  - install-mise
  - when:
      condition: << parameters.hooks >>
      steps:
        - run:
            name: Enable mise experimental for hooks
            command: mise settings set experimental true
  - run:
      name: Install mise tools
      command: <<include(scripts/install-mise-tools.sh)>>
      environment:
        MISE_INSTALL_LOCKED: << parameters.locked >>
        MISE_PROJECT_ROOT: << parameters.project_root >>
        MISE_TOOLS: << parameters.tools >>
