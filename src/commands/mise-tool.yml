description: >
  Records a mise tool name for a subsequent install-mise-tools invocation.
  Use inside install-mise-tools.tools, or call mise-java / mise-node / etc.
parameters:
  tool:
    type: string
    description: Tool name as declared in mise.toml (e.g. java, node, yarn)
steps:
  - run:
      name: Select mise tool << parameters.tool >>
      command: echo "<< parameters.tool >>" >> /tmp/mise-selected-tools.list
